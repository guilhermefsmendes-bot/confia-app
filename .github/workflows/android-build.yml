name: Build Android AAB

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Decode keystore
        run: |
          mkdir -p .secrets
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > .secrets/confia-upload-key.jks
          chmod 600 .secrets/confia-upload-key.jks

      - name: Build Android AAB
        env:
          CONFIA_KEYSTORE_FILE: ${{ github.workspace }}/.secrets/confia-upload-key.jks
          CONFIA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CONFIA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CONFIA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/bundle/release/*.aab
